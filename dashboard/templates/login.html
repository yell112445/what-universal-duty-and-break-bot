<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — What Universal Dashboard</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="bg-[#070a11] text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden font-['Plus_Jakarta_Sans','Sarabun']">

  <!-- Background Ambient Glows -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-[128px] pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-blue-600/15 rounded-full blur-[128px] pointer-events-none"></div>

  <!-- Login Card -->
  <div class="w-full max-w-md glass-panel p-8 sm:p-10 relative z-10 border border-slate-800 shadow-2xl rounded-2xl">

    <!-- Brand Header -->
    <div class="flex flex-col items-center text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center shadow-xl shadow-indigo-500/30 mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">WHAT UNIVERSAL</h1>
      <p class="text-xs font-semibold text-indigo-400 uppercase tracking-widest mt-1">Command & Management Portal</p>
      <p class="text-sm text-slate-400 mt-2 font-normal">ระบบศูนย์กลางจัดการข้อมูลและควบคุมคำสั่งบอท</p>
    </div>

    <!-- Error Alert Box -->
    {% if error %}
    <div class="mb-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm flex items-start gap-3">
      <svg class="w-5 h-5 text-rose-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
      </svg>
      <div>{{ error }}</div>
    </div>
    {% endif %}

    <!-- Discord OAuth2 Login Button -->
    {% if has_oauth2 and oauth_url %}
    <a href="{{ oauth_url }}" class="w-full py-3.5 px-4 rounded-xl font-semibold text-white bg-[#5865F2] hover:bg-[#4752C4] shadow-lg shadow-[#5865F2]/25 flex items-center justify-center gap-3 transition-all duration-200 hover:-translate-y-0.5">
      <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      <span>เข้าสู่ระบบด้วย Discord</span>
    </a>

    <div class="relative my-6 text-center">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
      <span class="relative bg-[#0d131f] px-3 text-xs text-slate-400 uppercase tracking-wider">หรือ</span>
    </div>
    {% endif %}

    <!-- Master Passcode Form (Fallback / Initial Setup) -->
    <form action="/auth/login_passcode" method="POST" class="space-y-4">
      <div>
        <label for="passcode" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Master Admin Passcode</label>
        <div class="relative">
          <input type="password" id="passcode" name="passcode" required placeholder="กรอกรหัสผ่านผู้ดูแลระบบ"
            class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700/80 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
        </div>
        <p class="text-[11px] text-slate-400 mt-2 leading-relaxed">
          * ค่าเริ่มต้น: <code class="text-indigo-300 bg-indigo-950/60 px-1.5 py-0.5 rounded">admin1234</code> (สามารถแก้ไขได้ในเมนูตั้งค่า)
        </p>
      </div>

      <button type="submit" class="w-full py-3 px-4 rounded-xl font-medium text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 transition-all duration-150 text-sm">
        เข้าสู่ระบบด้วย Passcode
      </button>
    </form>

    <div class="mt-8 text-center text-xs text-slate-400">
      What Universal Command Center &copy; 2026
    </div>

  </div>

</body>
</html>
